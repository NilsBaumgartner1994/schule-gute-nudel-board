# Prüft jeden Push und jeden Pull Request.
# Wenn alle Tests grün sind, wird ein (nicht als Entwurf markierter) Pull Request
# automatisch in main übernommen.
# Die Seite selbst veröffentlicht GitHub Pages bei jedem Push auf main von allein
# (Einstellung "Deploy from a branch", main, / (root)).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  automerge:
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pull Request übernehmen
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
